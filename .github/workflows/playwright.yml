name: Automation evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      LAB_RESULTS_DIR: test-results/reference
      LAB_REPORT_DIR: playwright-report/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify comparison policy with synthetic reports
        run: npm run check:comparison
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run and verify all seven reference cases
        run: npm run test:reference
      - name: Upload reference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reference-evidence
          path: |
            playwright-report/reference/
            test-results/reference/
          if-no-files-found: error
          retention-days: 30

  comparison:
    name: Known-fault comparison
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run buggy suite and verify exact known outcomes
        run: npm run test:comparison
      - name: Upload raw results and comparison verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: comparison-evidence
          path: |
            playwright-report/comparison/
            test-results/comparison/
          if-no-files-found: error
          retention-days: 30
